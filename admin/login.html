<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Connexion — Reg-Immo Admin</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>

    <div class="login-wrapper">

        <div class="login-card">
            <h1>Reg-Immo</h1>
            <p class="subtitle">Espace administration</p>

            <form id="form-login">
                <label for="email">Adresse email</label>
                <input type="email" id="email" placeholder="votre@email.com" autocomplete="email" required>

                <label for="password">Mot de passe</label>
                <div class="input-password-wrap">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" id="toggle-password" aria-label="Afficher le mot de passe">
                        <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <button type="submit" id="btn-connexion">Se connecter</button>
                <p class="message" id="msg-login"></p>
            </form>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="./login.js"></script>
</body>
</html>
